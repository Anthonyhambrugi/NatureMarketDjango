<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Perfil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <main class="py-4 py-sm-5">
        <div class="container">
            <div class="row">
                <div class="col-12 col-sm-10 col-md-8 col-lg-6 mx-auto">
                    <h1 class="mb-4 fs-4 fs-sm-3 text-center">Editar Perfil</h1>
                    <form action="" method="post" enctype="multipart/form-data" class="needs-validation">
                        {% csrf_token %}
                        <div class="form-group mb-3">
                            {{ form.as_p }}
                        </div>
                        <div class="d-flex gap-2 justify-content-center justify-content-sm-between">
                            <button type="submit" class="btn btn-success btn-sm">💾 Salvar Alterações</button>
                            <a href="{% url 'perfil:perfil' request.user.username %}" class="btn btn-secondary btn-sm">← Voltar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
